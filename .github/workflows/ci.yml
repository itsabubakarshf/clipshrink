name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo test --release

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: compressor-windows
            bin: compressor.exe
          - os: ubuntu-latest
            artifact: compressor-linux
            bin: compressor
          - os: macos-latest
            artifact: compressor-macos
            bin: compressor
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - name: Name the file for this platform
        shell: bash
        run: |
          mkdir dist
          case "${{ matrix.artifact }}" in
            compressor-windows) cp target/release/compressor.exe dist/compressor-windows.exe ;;
            compressor-linux)   cp target/release/compressor dist/compressor-linux && chmod +x dist/compressor-linux ;;
            compressor-macos)   cp target/release/compressor dist/compressor-macos && chmod +x dist/compressor-macos ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  # Publishes the three programs on the repo's "Releases" page.
  #  - every push        -> a pre-release called "latest" (always the newest build)
  #  - a tag like v0.1.0 -> a normal release with that name
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Move the "latest" tag to this commit
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          target_commitish: ${{ github.sha }}
          body: "Download the file for your system: compressor-windows.exe (Windows), compressor-linux (Ubuntu/Linux), compressor-macos (Mac, Apple Silicon). See SETUP.md for the step-by-step guide."
          files: dist/*
