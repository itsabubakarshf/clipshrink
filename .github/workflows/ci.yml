name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo test --release

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: clipshrink-windows
            bin: clipshrink.exe
          - os: ubuntu-latest
            artifact: clipshrink-linux
            bin: clipshrink
          - os: macos-latest
            artifact: clipshrink-macos
            bin: clipshrink
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - name: Name the file for this platform
        shell: bash
        run: |
          mkdir dist
          case "${{ matrix.artifact }}" in
            clipshrink-windows) cp target/release/clipshrink.exe dist/ClipShrink-portable-windows.exe ;;
            clipshrink-linux)   cp target/release/clipshrink dist/clipshrink-linux && chmod +x dist/clipshrink-linux ;;
            clipshrink-macos)   cp target/release/clipshrink dist/clipshrink-macos && chmod +x dist/clipshrink-macos ;;
          esac
      - name: Build the Windows installer
        if: matrix.artifact == 'clipshrink-windows'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          & $iscc "/DMyAppVersion=$v" installer\clipshrink.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  # Publishes the three programs on the repo's "Releases" page.
  #  - every push        -> a pre-release called "latest" (always the newest build)
  #  - a tag like v0.1.0 -> a normal release with that name
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Remove the previous "latest" release (it is recreated below)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --yes --cleanup-tag || true
      - name: Point the "latest" tag at this commit
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          target_commitish: ${{ github.sha }}
          body: "Windows: ClipShrink-Setup-windows.exe (installer) or ClipShrink-portable-windows.exe (portable, no install). Ubuntu/Linux: clipshrink-linux. Mac (Apple Silicon): clipshrink-macos. See SETUP.md for the step-by-step guide."
          files: dist/*
