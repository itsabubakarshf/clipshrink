[package]
name = "compressor"
version = "0.2.0"
edition = "2021"
description = "Shrink videos by a percentage or split them into upload-size parts - desktop app and CLI built on ffmpeg"
repository = "https://github.com/itsabubakarshf/compressor"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
indicatif = "0.17"
serde_json = "1"
ureq = { version = "2", features = ["native-certs"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
rfd = "0.17.2"

[build-dependencies]
winresource = "0.1.34"
